name: offline
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build:web
      - run: npm run test:offline
      - run: npm run test:v:offline
      - run: npm run demo:offline
      - run: npm run doctor -- --profile simulated
      - run: npm run bridge:protocol -- --config configs/simulated.json
      - run: npm run cli -- bridge --mode inspect --config configs/client-offline.example.json
      # Static web check only (typecheck + production bundle); the behavioral browser run is
      # the separate browser-e2e job below via `npm run test:web:e2e`.
      - run: npm run check:web
  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Install the exact Chromium build Playwright expects; a missing browser fails the job.
      - run: npx playwright install --with-deps chromium
      # Behavioral browser E2E: builds dist and the web bundle, starts isolated local servers on
      # temp SQLite paths and drives headless Chromium. Screenshots/video/trace stay off, and any
      # server, assertion or cleanup failure exits non-zero.
      - run: npm run test:web:e2e
  windows-static:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The Windows job runs the same dist-dependent integration tests; build before testing
      # so they execute instead of silently skipping when dist/ is absent.
      - run: npm run build
      - run: npm run test:offline
      # Static parse of the PowerShell helper; this does not execute SendInput or capture.
      - shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path native/windows/FurEverCraft.Helper.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
