name: offline
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build:web
      - run: npm run test:offline
      - run: npm run test:v:offline
      - run: npm run demo:offline
      - run: npm run doctor -- --profile simulated
      - run: npm run bridge:protocol -- --config configs/simulated.json
      - run: npm run cli -- bridge --mode inspect --config configs/client-offline.example.json
      - run: npm run test:web
  windows-static:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:offline
      # Static parse of the PowerShell helper; this does not execute SendInput or capture.
      - shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path native/windows/FurEverCraft.Helper.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
