name: offline
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:offline
      - run: npm run demo:offline
      - run: npm run doctor -- --profile simulated
      - run: npm run bridge:protocol -- --config configs/simulated.json
      - run: npm run cli -- bridge --mode inspect --config configs/client-offline.example.json
